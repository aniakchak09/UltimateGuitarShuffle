<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #e84040;
    }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
      min-height: 16px;
    }
    #song-card {
      display: none;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    #song-name {
      font-size: 14px;
      font-weight: bold;
    }
    #band-name {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
    }
    #btn-shuffle {
      background: #e84040;
      color: white;
      font-weight: bold;
    }
    #btn-shuffle:hover { background: #c73333; }
    #btn-open {
      display: none;
      background: #333;
      color: #f0f0f0;
    }
    #btn-open:hover { background: #444; }
  </style>
</head>
<body>
  <h2>🎸 UG Shuffler</h2>
  <div id="status">Open a UG playlist or favorites page first.</div>
  <div id="song-card">
    <div id="song-name"></div>
    <div id="band-name"></div>
  </div>
  <button class="btn" id="btn-shuffle">Shuffle</button>
  <button class="btn" id="btn-open">Open Tab</button>
  <script src="popup.js"></script>
</body>
</html>
